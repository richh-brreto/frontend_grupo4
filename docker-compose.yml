services:
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./db.json:/app/db.json
    command: npx --yes json-server@0.17.4 --host 0.0.0.0 --port 3000 db.json
    expose:
      - "3000"

  frontend:
    image: igortrindade13/frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - api